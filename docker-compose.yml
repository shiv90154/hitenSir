services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bharattrip
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: bharattrip
    volumes:
      - bharattrip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharattrip"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bharattrip:${DB_PASSWORD}@db:5432/bharattrip?schema=public
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - ./uploads:/app/public/uploads

volumes:
  bharattrip_pgdata:
